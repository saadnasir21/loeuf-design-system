<!-- @dsCard group="Components" name="Badges & tags" subtitle="Rose accent · new / sale / soft / stock" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--noir:#161616;--blanc:#FAF9F6;--charcoal:#2E2E2E;--stone:#8A8A8A;--success:#4F7A5B;--rose:#C97F75;--yolk:#DDA63A;--sans:"Gotham","Montserrat",Arial,sans-serif}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:18px}
.card{background:#fff;border:1px solid #E2E1DE;border-radius:5px;padding:30px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:6px 12px;border-radius:2px;background:var(--rose);color:#fff}
.noir{background:var(--noir);color:var(--blanc)}.soft{background:var(--mist);color:var(--charcoal)}
.out{background:transparent;color:var(--rose);border:1px solid var(--rose)}.stock{background:transparent;color:var(--success);border:1px solid var(--success)}
.announce{margin-top:22px;background:var(--noir);color:var(--blanc);text-align:center;padding:11px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:3px}
.announce b{color:var(--rose)}
</style></head><body>
<div class="eyebrow">Components · Badges &amp; tags</div>
<div class="card">
  <div class="row">
    <span class="badge">New in</span>
    <span class="badge">Sale −15%</span>
    <span class="badge noir">Limited</span>
    <span class="badge soft">Restock</span>
    <span class="badge out">Detail</span>
    <span class="badge stock">In stock</span>
  </div>
  <div class="announce">Free shipping over Rs 5,000 · Code <b>SUMMER15</b></div>
</div>
</body></html>

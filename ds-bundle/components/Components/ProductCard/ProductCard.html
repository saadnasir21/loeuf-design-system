<!-- @dsCard group="Components" name="Product card" subtitle="Egg-crop image · badge · name · price" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--almond:#E7DECF;--noir:#161616;--silver:#C4C4C4;--stone:#8A8A8A;--charcoal:#2E2E2E;--rose:#C97F75;--serif:"Fraunces",Georgia,serif;--sans:"Gotham","Montserrat",Arial,sans-serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:18px}
.row{display:flex;gap:22px;flex-wrap:wrap}
.product{border:1px solid #E2E1DE;border-radius:5px;overflow:hidden;background:#fff;width:240px}
.ph{height:230px;background:var(--mist);position:relative;display:flex;align-items:center;justify-content:center}
.ph.almond{background:var(--almond)}
.badge{position:absolute;top:13px;left:13px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:5px 11px;border-radius:2px;background:var(--rose);color:#fff}
.crop{width:120px;height:150px;border-radius:var(--egg);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--silver);font-size:12px;box-shadow:0 4px 16px rgba(22,22,22,.08)}
.info{padding:16px 16px 20px}.cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
.info h4{font-family:var(--serif);font-size:20px;margin:6px 0 8px;font-weight:400}
.price{font-size:13px;color:var(--charcoal)}.was{color:var(--stone);text-decoration:line-through;margin-right:7px}
</style></head><body>
<div class="eyebrow">Components · Product card</div>
<div class="row">
  <div class="product"><div class="ph"><span class="badge">−15%</span><div class="crop">Camila</div></div><div class="info"><div class="cat">Apparel</div><h4>Camila</h4><div class="price"><span class="was">Rs 6,500</span>Rs 5,525</div></div></div>
  <div class="product"><div class="ph almond"><span class="badge" style="background:#161616">New</span><div class="crop">Nouveau Nœud</div></div><div class="info"><div class="cat">Accessories</div><h4>Nouveau Nœud Mini</h4><div class="price">Rs 2,800</div></div></div>
</div>
</body></html>

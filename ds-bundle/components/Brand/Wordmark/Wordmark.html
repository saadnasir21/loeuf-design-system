<!-- @dsCard group="Brand" name="Wordmark" subtitle="Lowercase · egg-dot motif · on light / dark / mist" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--white:#FFF;--noir:#161616;--blanc:#FAF9F6;--almond:#E7DECF;--silver:#C4C4C4;--stone:#8A8A8A;--rose:#C97F75;--sans:"Gotham","Montserrat",Arial,sans-serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{height:130px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid #E2E1DE}
.wm{font-family:var(--sans);font-weight:500;letter-spacing:.3em;text-transform:lowercase;font-size:26px;display:inline-flex;align-items:center;gap:1px}
.wm .o{width:14px;height:18px;border:2px solid var(--rose);border-radius:var(--egg);display:inline-block}
.cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.on-light{background:var(--white)}.on-noir{background:var(--noir)}.on-noir .wm{color:var(--blanc)}.on-noir .wm .o{border-color:#fff}.on-noir .cap{color:var(--silver)}.on-mist{background:var(--mist)}.on-almond{background:var(--almond)}
.note{margin-top:18px;font-size:13px;color:var(--graphite,#555)}
</style></head><body>
<div class="eyebrow">Brand · Wordmark</div>
<div class="row">
  <div class="box on-light"><span class="wm">l<span class="o"></span>euf</span><span class="cap">Primary on White</span></div>
  <div class="box on-noir"><span class="wm">l<span class="o"></span>euf</span><span class="cap">Reversed on Noir</span></div>
  <div class="box on-mist"><span class="wm">l<span class="o"></span>euf</span><span class="cap">On Mist</span></div>
</div>
<p class="note">Set lowercase in Gotham Medium, tracking ≥ 0.3em. The egg replaces the “o” — the one place the Rose accent appears in the mark. Min size 80px; clear space ≥ cap-height of “l”.</p>
</body></html>

<!-- @dsCard group="Brand" name="The œuf motif" subtitle="Oval crop · frame · mark · peek" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--white:#FFF;--noir:#161616;--almond:#E7DECF;--silver:#C4C4C4;--stone:#8A8A8A;--rose:#C97F75;--rosesoft:#E7C4BD;--serif:"Fraunces",Georgia,serif;--sans:"Gotham","Montserrat",Arial,sans-serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:20px}
.stage{background:var(--white);border:1px solid #E2E1DE;border-radius:6px;padding:34px;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.egg{width:120px;height:150px;border-radius:var(--egg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--silver);font-size:12px}
.egg.mist{background:var(--mist)}.egg.rose{background:var(--rosesoft)}.egg.line{border:1.5px solid var(--noir);background:transparent}
.cap{display:block;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-top:10px}
.note{margin-top:18px;font-size:13px;color:#555;max-width:560px}
</style></head><body>
<div class="eyebrow">Brand · Signature device</div>
<div class="stage">
  <div><div class="egg mist">crop</div><span class="cap">photo mask</span></div>
  <div><div class="egg rose">frame</div><span class="cap">quote / cta</span></div>
  <div><div class="egg line"></div><span class="cap">outline mark</span></div>
</div>
<p class="note">loeuf means <em>the egg</em>, so the egg is the system: one soft, slightly-tapered oval used to crop hero shots, frame quotes, build highlight icons, and dot the wordmark. One shape, infinitely wearable.</p>
</body></html>

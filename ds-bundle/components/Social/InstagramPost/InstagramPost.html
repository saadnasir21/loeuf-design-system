<!-- @dsCard group="Social" name="Instagram post (4:5)" subtitle="New arrival · sale · quote · egg-crop" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--cloud:#F1F0EE;--almond:#E7DECF;--noir:#161616;--blanc:#FAF9F6;--silver:#C4C4C4;--stone:#8A8A8A;--rose:#C97F75;--serif:"Fraunces",Georgia,serif;--sans:"Gotham","Montserrat",Arial,sans-serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:18px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.frame{width:208px;height:260px;border-radius:4px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(22,22,22,.10);border:1px solid #E2E1DE}
.post{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start}.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}.btm{display:flex;justify-content:space-between;align-items:flex-end}
.badge{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:2px;background:var(--rose);color:#fff}
.badge.noir{background:var(--noir);color:#fff}
.wm{font-weight:500;letter-spacing:.26em;text-transform:lowercase;font-size:10px;display:inline-flex;align-items:center;gap:1px}.wm .o{width:6px;height:8px;border:1.4px solid var(--rose);border-radius:var(--egg)}
.dark .wm,.dark .head,.dark .k{color:var(--blanc)}.dark .wm .o{border-color:#fff}
.head{font-family:var(--serif);line-height:1.05}.k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
.crop{width:96px;height:120px;border-radius:var(--egg);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--silver);font-size:11px}
.pill{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border:1px solid #fff;border-radius:999px;color:#fff}
.cap{font-size:11px;color:#555;margin-top:8px;text-align:center}
</style></head><body>
<div class="eyebrow">Social · Instagram feed post — 1080 × 1350 (4:5)</div>
<div class="row">
  <div><div class="frame" style="background:var(--mist)"><div class="post"><div class="top"><span class="badge">New in</span><span class="wm">l<span class="o"></span>euf</span></div><div class="mid"><div class="crop">product</div></div><div class="btm"><div><div class="k">Apparel</div><div class="head" style="font-size:18px">Camila</div></div><span style="font-size:11px">Rs 6,500</span></div></div></div><div class="cap">New arrival</div></div>
  <div><div class="frame dark" style="background:var(--rose)"><div class="post"><div class="top"><span class="badge noir">Limited</span><span class="wm">l<span class="o"></span>euf</span></div><div class="mid"><div class="k" style="color:rgba(255,255,255,.8)">Summer</div><div class="head" style="font-size:30px;font-weight:300;color:#fff">15% off<br><em style="font-style:italic">everything</em></div><span class="pill">SUMMER15</span></div><div class="btm"></div></div></div><div class="cap">Sale / promo</div></div>
  <div><div class="frame dark" style="background:var(--noir)"><div class="post"><div class="top"><span></span><span class="wm">l<span class="o"></span>euf</span></div><div class="mid"><div class="head" style="font-size:20px;font-weight:300;color:var(--blanc)">"Crafted for the<br>way you <em style="font-style:italic">move.</em>"</div></div><div class="btm" style="justify-content:center"><span class="k">The Elements of Style</span></div></div></div><div class="cap">Word tile</div></div>
</div>
</body></html>

<!-- @dsCard group="Social" name="Instagram story (9:16)" subtitle="Drop · countdown · quote · safe zones" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mist:#EAEAEA;--almond:#E7DECF;--noir:#161616;--blanc:#FAF9F6;--silver:#C4C4C4;--stone:#8A8A8A;--rose:#C97F75;--rose-deep:#B0685E;--serif:"Fraunces",Georgia,serif;--sans:"Gotham","Montserrat",Arial,sans-serif;--egg:50% 50% 50% 50%/62% 62% 38% 38%}
*{box-sizing:border-box;margin:0}body{font-family:var(--sans);background:var(--mist);color:var(--noir);padding:28px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:18px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.frame{width:150px;height:266px;border-radius:4px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(22,22,22,.10);border:1px solid #E2E1DE}
.post{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 16px;gap:10px}
.top{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center}
.btm{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center}
.wm{font-weight:500;letter-spacing:.26em;text-transform:lowercase;font-size:10px;display:inline-flex;align-items:center;gap:1px}.wm .o{width:6px;height:8px;border:1.4px solid var(--rose);border-radius:var(--egg)}
.dark .wm,.dark .head,.dark .k{color:var(--blanc)}.dark .wm .o{border-color:#fff}
.badge{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:2px;background:var(--rose);color:#fff}
.head{font-family:var(--serif);line-height:1.05}.k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)}
.crop{width:80px;height:100px;border-radius:var(--egg);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--silver);font-size:10px}
.pill{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border:1px solid var(--noir);border-radius:999px}
.dark .pill{border-color:#fff;color:#fff}
.safe{position:absolute;left:0;right:0;height:16%;background:repeating-linear-gradient(45deg,rgba(201,127,117,.12),rgba(201,127,117,.12) 5px,transparent 5px,transparent 10px)}
.safe.t{top:0}.safe.b{bottom:0}
.cap{font-size:11px;color:#555;margin-top:8px;text-align:center}
</style></head><body>
<div class="eyebrow">Social · Instagram story — 1080 × 1920 (9:16) · keep content out of striped zones</div>
<div class="row">
  <div><div class="frame" style="background:var(--mist)"><div class="safe t"></div><div class="top"><span class="wm">l<span class="o"></span>euf</span></div><div class="post"><span class="badge">Just dropped</span><div class="crop">Salla</div></div><div class="btm"><span class="pill">Tap to shop</span></div><div class="safe b"></div></div><div class="cap">Product drop</div></div>
  <div><div class="frame dark" style="background:var(--rose)"><div class="safe t"></div><div class="top"><span class="wm">l<span class="o"></span>euf</span></div><div class="post"><div class="k" style="color:rgba(255,255,255,.8)">Summer</div><div class="head" style="font-size:30px;color:#fff;font-weight:300">−15%</div><span style="font-size:9px;color:#fff">⏱ 06:12:44</span></div><div class="btm"><span class="pill">SUMMER15</span></div><div class="safe b"></div></div><div class="cap">Sale countdown</div></div>
  <div><div class="frame dark" style="background:var(--noir)"><div class="safe t"></div><div class="top"><span class="wm">l<span class="o"></span>euf</span></div><div class="post"><div class="head" style="font-size:18px;color:var(--blanc);font-weight:300">"The way you <em style="font-style:italic">live.</em>"</div></div><div class="btm"><span class="k">@loeuf.pk</span></div><div class="safe b"></div></div><div class="cap">Quote</div></div>
</div>
</body></html>
